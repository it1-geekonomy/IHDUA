name: ihdua

# Cap container logs (Docker keeps them forever by default).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  ai-chatbot:
    build: ./ai-chatbot
    restart: unless-stopped
    logging: *logging
    env_file: .env.prod
    environment:
      PORT: 8001
      DB_HOST: postgres
      DB_PORT: 5432
      INTERNAL_API_KEY: ${AI_SERVICE_INTERNAL_KEY}
      SITE_BASE_URL: ${PUBLIC_URL}
      SITE_CRAWL_URL: http://frontend:3000
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build: ./backend
    restart: unless-stopped
    logging: *logging
    env_file: .env.prod
    environment:
      NODE_ENV: production
      PORT: 6061
      DB_HOST: postgres
      DB_PORT: 5432
      DB_SYNCHRONIZE: "false"
      CHATBOT_SERVICE_URL: http://ai-chatbot:8001
      AI_SERVICE_INTERNAL_KEY: ${AI_SERVICE_INTERNAL_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      ai-chatbot:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_URL}/api
        NEXT_PUBLIC_SITE_URL: ${PUBLIC_URL}
    restart: unless-stopped
    logging: *logging
    environment:
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME}
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL}
      R2_REGION: ${R2_REGION:-auto}
      CHATBOT_SERVICE_URL: http://ai-chatbot:8001
      AI_SERVICE_INTERNAL_KEY: ${AI_SERVICE_INTERNAL_KEY}
      DOWNLOAD_ALLOWED_HOSTS: ${DOWNLOAD_ALLOWED_HOSTS:-}
    volumes:
      - frontend-image-cache:/app/.next/cache/images
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    logging: *logging
    ports:
      - "80:80"
      # Keep 443 ready for when you add a domain + Let's Encrypt later
      - "443:443"
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend

  # One-off later: docker compose --profile certbot run --rm certbot certonly ...
  certbot:
    image: certbot/certbot:latest
    profiles: ["certbot"]
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt

volumes:
  pgdata:
  frontend-image-cache:
