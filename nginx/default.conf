upstream ihdua_frontend {
    server frontend:3000;
}

upstream ihdua_backend {
    server backend:6061;
}

# HTTP site + ACME (works before and after TLS is enabled).
# When certs exist, deploy.sh also installs https.conf and this block
# redirects to HTTPS except for the ACME path.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name ihdua.org www.ihdua.org _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    include /etc/nginx/conf.d/ihdua-proxy.inc;
}
