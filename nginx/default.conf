upstream ihdua_frontend {
    server frontend:3000;
}

upstream ihdua_backend {
    server backend:6061;
}

# IP-based HTTP only (no domain / TLS yet).
# When you add a domain later, switch to HTTPS + certbot like HCG Foundation.
server {
    listen 80 default_server;
    server_name _;

    # Ready for Let's Encrypt HTTP-01 when you add a domain
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    include /etc/nginx/conf.d/ihdua-proxy.inc;
}
